[build-system]
requires = ["setuptools<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lituanicax-irc"
version = "0.1.0"
description = "RL training environment for the LituanicaX intelligent robot competition."
readme = "README.md"
requires-python = "==3.11.*"

# Only list the core project dependencies here. 
# Anything already provided globally by Isaac Sim / Isaac Lab is excluded.
dependencies = [
    "setuptools<82.0.0",
    "tensordict",
]

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]
include = ["cone_track*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version == '3.11.*'"]