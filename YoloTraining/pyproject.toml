[project]
name = "rccar-yolo-training"
version = "0.1.0"
description = "Apple-track detector for autonomous RC car (YOLO -> Hailo-8)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.51",
    "ultralytics>=8.3.100",
    "opencv-python>=4.10",
    "numpy",
    "pillow",
    "tqdm",
    "onnx>=1.16",
    "onnxslim",
    "onnxruntime",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
